name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  science:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up notebook environment
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install scientific dependencies
        run: uv sync --locked
      - name: Verify both tutorials and extracted student notebooks
        run: |
          uv run python -m unittest discover -s tests -p 'test*experiment.py' -v
          uv run python scripts/check_notebook.py

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python for asset preparation
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: npm ci
      - name: Cache verified Python wheels
        uses: actions/cache@v4
        with:
          path: .cache/pyodide
          key: pyodide-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/tutorials/**/tutorial.json') }}
      - name: Build static site
        run: npm run build
      - name: Install browser for deployment checks
        run: npx playwright install --with-deps chromium
      - name: Check course navigation and demos under a subdirectory
        run: npx playwright test tests/browser/deployment.spec.ts tests/browser/demo-parity.spec.ts tests/browser/runtime-assets.spec.ts tests/browser/tutorial05.spec.ts
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, science]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
