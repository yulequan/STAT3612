name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Also run the Pyodide browser workflows (about 6 minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  science:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up notebook environment
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install scientific dependencies
        run: uv sync --locked
      - name: Verify both tutorials and extracted student notebooks
        run: |
          uv run python -m unittest discover -s tests -p 'test*experiment.py' -v
          uv run python -m unittest discover -s tests -p 'test_tutorial06_materials.py' -v
          uv run python -m unittest discover -s tests -p 'test_tutorial07_materials.py' -v
          uv run python -m unittest discover -s tests -p 'test_project_report_templates.py' -v
          uv run python scripts/check_notebook.py

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python for asset preparation
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: npm ci
      - name: Cache verified Python wheels
        uses: actions/cache@v4
        with:
          path: .cache/pyodide
          key: pyodide-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/tutorials/**/tutorial.json') }}
      - name: Build static site
        run: npm run build
      - name: Share the built site with the browser checks
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The gate for every push: the built site, its navigation and the slide decks.
  # These checks are seconds, because none of them boots Pyodide.
  browser:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Check the course shell and the slide decks
        run: >-
          npx playwright test
          tests/browser/deployment.spec.ts
          tests/browser/tutorial06.spec.ts
          tests/browser/tutorial07.spec.ts

  # Tutorial UI workflows boot a real Pyodide worker per test, so they take
  # minutes. Run them before a release or a teaching session:
  #   gh workflow run deploy-pages.yml -f full=true
  # The science job above already runs their experiments and notebooks on
  # every push, so this is a UI check, not the only check.
  browser-full:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up notebook environment
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install scientific dependencies
        run: uv sync --locked
      - name: Cache verified Python wheels
        uses: actions/cache@v4
        with:
          path: .cache/pyodide
          key: pyodide-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/tutorials/**/tutorial.json') }}
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Prepare assets served by the development server
        run: npm run prepare:assets
      - name: Check every tutorial workflow, the demos and asset preparation
        run: >-
          npx playwright test
          tests/browser/tutorial04.spec.ts
          tests/browser/tutorial05.spec.ts
          tests/browser/tutorial08.spec.ts
          tests/browser/demo-parity.spec.ts
          tests/browser/runtime-assets.spec.ts

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, science, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
