name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  science:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up notebook environment
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install scientific dependencies
        run: uv sync --locked
      - name: Verify both tutorials and extracted student notebooks
        run: |
          uv run python -m unittest discover -s tests -p 'test*experiment.py' -v
          uv run python -m unittest discover -s tests -p 'test_tutorial06_materials.py' -v
          uv run python -m unittest discover -s tests -p 'test_tutorial07_materials.py' -v
          uv run python -m unittest discover -s tests -p 'test_project_report_templates.py' -v
          uv run python scripts/check_notebook.py

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python for asset preparation
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: npm ci
      - name: Cache verified Python wheels
        uses: actions/cache@v4
        with:
          path: .cache/pyodide
          key: pyodide-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/tutorials/**/tutorial.json') }}
      - name: Build static site
        run: npm run build
      - name: Share the built site with the browser checks
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Browser checks are minutes of real Pyodide computation, so they run as two
  # parallel shards instead of one serial job. Tutorial 05 alone is as long as
  # everything else; keep it on its own shard. The site under test is the built
  # artifact, never a second build.
  browser:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tutorial05 workflows
            specs: tests/browser/tutorial05.spec.ts
          - name: course shell, decks and remaining tutorials
            specs: >-
              tests/browser/deployment.spec.ts
              tests/browser/demo-parity.spec.ts
              tests/browser/runtime-assets.spec.ts
              tests/browser/tutorial06.spec.ts
              tests/browser/tutorial07.spec.ts
              tests/browser/tutorial08.spec.ts
    name: browser (${{ matrix.name }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Python for the development server
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache verified Python wheels
        uses: actions/cache@v4
        with:
          path: .cache/pyodide
          key: pyodide-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/tutorials/**/tutorial.json') }}
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser for deployment checks
        run: npx playwright install --with-deps chromium
      - name: Run the browser checks
        run: npx playwright test ${{ matrix.specs }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, science, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
